name: Build M-Fayed Studio 3.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Project
        shell: bash
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE_FILE=$(find extracted -type f -name package.json | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Building project: $PROJECT_DIR"

      - name: Install Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Setup Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Install Native Plugin and Icons
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          JAVA_DIR=android/app/src/main/java/com/mfayed/studio
          mkdir -p "$JAVA_DIR"

          cp native/*.java "$JAVA_DIR/"

          cp -r icons-res/* android/app/src/main/res/

      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Fayed-Studio-3.3
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
