name: Build M-Fayed Studio APK

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Project
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -name package.json | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Install Icon Generator
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --save-dev @capacitor/assets

      - name: Generate Icons
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx capacitor-assets generate --android

      - name: Setup Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Fayed-Studio-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
